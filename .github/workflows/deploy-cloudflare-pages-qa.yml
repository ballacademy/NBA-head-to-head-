name: Deploy QA to Cloudflare Pages

on:
  push:
    branches:
      - qa
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Build and deploy QA
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve QA D1 database id
        env:
          QA_D1_DATABASE_ID: ${{ secrets.QA_D1_DATABASE_ID }}
        run: |
          if [ -z "${QA_D1_DATABASE_ID}" ]; then
            echo "::error::Repository secret QA_D1_DATABASE_ID is missing."
            exit 1
          fi
          if ! [[ "${QA_D1_DATABASE_ID}" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "::error::QA_D1_DATABASE_ID must be a UUID from \`wrangler d1 create draft-day-gm-qa\` (got unexpected format)."
            exit 1
          fi
          sed -i "s/REPLACE_WITH_QA_D1_DATABASE_ID/${QA_D1_DATABASE_ID}/" wrangler.qa.toml
          if grep -q 'REPLACE_WITH_QA_D1_DATABASE_ID' wrangler.qa.toml; then
            echo "::error::Failed to inject QA_D1_DATABASE_ID into wrangler.qa.toml."
            exit 1
          fi
          # wrangler-action runs \`wrangler <command>\`; point default config at QA.
          cp wrangler.qa.toml wrangler.toml
          echo "QA D1 id format ok; wrangler.toml switched to QA config."

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify QA D1 auth
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          QA_D1_DATABASE_ID: ${{ secrets.QA_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          echo "CLOUDFLARE_ACCOUNT_ID prefix: ${CLOUDFLARE_ACCOUNT_ID:0:6}…"
          echo "QA_D1_DATABASE_ID prefix: ${QA_D1_DATABASE_ID:0:8}…"
          npx wrangler whoami
          echo "--- d1 list ---"
          npx wrangler d1 list
          if ! npx wrangler d1 list | grep -q "draft-day-gm-qa"; then
            echo "::error::Token/account cannot see database draft-day-gm-qa. Create it in this Cloudflare account, or fix CLOUDFLARE_ACCOUNT_ID / token Account Resources."
            exit 1
          fi
          if ! npx wrangler d1 list | grep -qi "${QA_D1_DATABASE_ID}"; then
            echo "::error::QA_D1_DATABASE_ID is not in this account's D1 list. Re-copy the uuid from \`wrangler d1 list\` / create output into the GitHub secret."
            exit 1
          fi

      # Shell step (not wrangler-action) so auth/permission errors are not swallowed.
      - name: Apply QA D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          # Wrangler v4 has no --yes on this command; CI skips the confirm prompt.
          npx wrangler d1 migrations apply draft-day-gm-qa --remote 2>&1 | tee /tmp/qa-d1-migrate.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "::error::QA D1 migrations failed (API 7403 usually means wrong account id, wrong DB uuid, or token Account Resources not including this account)."
            exit 1
          fi

      - name: Deploy QA to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=nba-head-to-head-qa --branch=qa --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
