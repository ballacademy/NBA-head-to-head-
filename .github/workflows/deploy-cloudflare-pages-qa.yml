name: Deploy QA to Cloudflare Pages

on:
  push:
    branches:
      - qa
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-qa:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Build and deploy QA
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve QA D1 database id
        env:
          QA_D1_DATABASE_ID: ${{ secrets.QA_D1_DATABASE_ID }}
        run: |
          if [ -n "${QA_D1_DATABASE_ID}" ]; then
            sed -i "s/REPLACE_WITH_QA_D1_DATABASE_ID/${QA_D1_DATABASE_ID}/" wrangler.qa.toml
          fi
          if grep -q 'REPLACE_WITH_QA_D1_DATABASE_ID' wrangler.qa.toml; then
            echo "::error::Set repository secret QA_D1_DATABASE_ID (from \`wrangler d1 create draft-day-gm-qa\`), or commit the database_id into wrangler.qa.toml."
            exit 1
          fi
          # wrangler-action runs \`wrangler <command>\`; point default config at QA.
          cp wrangler.qa.toml wrangler.toml

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Apply QA D1 migrations
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply draft-day-gm-qa --remote

      - name: Deploy QA to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=nba-head-to-head-qa --branch=qa --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
